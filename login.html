<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Parking Ltd.</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><h1>Parking Ltd. - Customer Portal</h1></header>
<div class="container">
    <div class="card">
        <h2>Account Registration / Login</h2>
        <form id="authForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <div class="form-group">
                <label>License Plate Number (for LPR)</label>
                <input type="text" id="licensePlate" placeholder="e.g. ABC-1234" required>
            </div>
            <button type="submit">Secure Login</button>
        </form>
    </div>
</div>
<script src="js\main.js"></script>
</body>
</html>
