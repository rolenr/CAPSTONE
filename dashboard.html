<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Parking Ltd.</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard">
<header><h1>Parking Ltd. - Customer Portal</h1></header>
<nav>
    <a href="dashboard.html">Live Map & Wallet</a>
    <a href="reserve.html">Reserve Slot</a>
    <a href="violations.html">Violations Tracker</a>
    <a href="#" id="logoutBtn">Logout</a>
</nav>
<div class="container">

    <!-- NEW: Express Check-In & Auto-Allocation Card -->
    <div class="card">
        <h2>Express Check-In & Slot Assignment</h2>
        <form id="checkinForm">
            <div class="form-group" style="margin-bottom: 12px;">
                <label for="checkinPlate"><strong>License Plate:</strong></label>
                <input type="text" id="checkinPlate" placeholder="e.g. ABC-1234" style="width: 100%; padding: 8px; margin-top: 4px;">
            </div>
            <div class="form-group" style="margin-bottom: 12px;">
                <label for="checkinZone"><strong>Preferred Zone (Optional):</strong></label>
                <select id="checkinZone" style="width: 100%; padding: 8px; margin-top: 4px;">
                    <option value="">Any Available Zone</option>
                    <option value="A">Zone A (VIP / PWD)</option>
                    <option value="B">Zone B</option>
                    <option value="C">Zone C</option>
                </select>
            </div>
            <button type="submit" style="padding: 10px 16px; cursor: pointer;">Get Next Available Slot & QR</button>
        </form>
    </div>

    <!-- Live Map Grid -->
    <div class="card">
        <h2>Live Parking Map Availability</h2>
        <div class="map-grid" id="liveMap">Loading capacity data...</div>
    </div>
    
    <!-- Digital QR Wallet -->
    <div class="card qr-wallet" id="qrWalletSection" style="display: none;">
        <h2>Your Digital Token Wallet</h2>
        <p id="assignedSlotDisplay" style="font-weight: bold; font-size: 1.1em; color: #2b6cb0;"></p>
        <p>Scan this at the entrance/exit terminals.</p>
        <img id="qrCodeImage" src="" alt="Parking QR Token">
        <p><strong>Status:</strong> <span id="tokenStatus" style="color: #38a169">ACTIVE_ENTRY</span></p>
    </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
