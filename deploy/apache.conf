<VirtualHost *:80>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Require all granted
        AllowOverride None
        Options -Indexes +SymLinksIfOwnerMatch
        RewriteEngine On
        RewriteRule ^(?:backend/database|deploy|docs|output|tests|computer_vision|vercel-proxy)(?:/|$) - [R=404,L]
        RewriteRule (^|/)\. - [R=404,L]
        RewriteRule ^backend/(?!api/endpoints\.php$|api/local_reservation_payments\.php$).* - [R=404,L]
        RewriteRule ^.*\.(?:pt|db|sql|sqbpro|jsonl|mov|mp4)$ - [R=404,L,NC]
        RewriteCond %{REQUEST_URI} !^/deploy/front.php$
        RewriteRule ^.*\.html$ deploy/front.php [END]
        DirectoryIndex index.html
    </Directory>
    <FilesMatch "^(Dockerfile|render\.yaml)$">
        Require all denied
    </FilesMatch>
    SetEnvIf X-Forwarded-Proto https HTTPS=on
    Header always set Cache-Control "no-store"
    php_admin_value session.save_path /var/data/sessions
</VirtualHost>
