<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Parking Ltd.</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">

<header class="app-header">
    <div class="header-inner">
        <a href="login.html" class="brand-wrap">
            <div class="brand-icon">P</div>
            <div class="brand-title">Parking Ltd.</div>
            <span class="brand-badge">Facility Portal</span>
        </a>
        <div class="header-meta">
            <div class="system-status-indicator">
                <span class="status-indicator-dot"></span>
                <span>Gatehouse Edge Node Online</span>
            </div>
        </div>
    </div>
</header>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-header-icon">P</div>
            <h2>Sign In</h2>
            <p>Enter your credentials to access operations or driver services</p>
        </div>

        <form id="authForm" class="auth-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" autocomplete="email" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-primary-block">Sign In</button>
        </form>

        <div class="auth-footer">
            <p>New driver? <a href="register.html">Register a vehicle</a></p>
        </div>

        <!-- Quick Demo Credentials for Evaluation & Testing -->
        <div class="auth-demo-toolbar">
            <div class="demo-toolbar-label">Demo Quick Fill</div>
            <div class="demo-buttons-row">
                <button type="button" id="quickAdminBtn" class="btn-demo-quick">Admin (Operations)</button>
                <button type="button" id="quickDriverBtn" class="btn-demo-quick">Driver (Customer)</button>
            </div>
        </div>
    </div>
</div>

<footer class="app-footer">
    Parking Ltd. &bull; Automated Facility Management System &bull; Secure Gatehouse Operations
</footer>

<script src="js/main.js"></script>
<script>
    document.getElementById('quickAdminBtn')?.addEventListener('click', () => {
        document.getElementById('email').value = 'rorocruz@gmail.com';
        document.getElementById('password').value = 'admin123';
    });
    document.getElementById('quickDriverBtn')?.addEventListener('click', () => {
        document.getElementById('email').value = 'driver1@gmail.com';
        document.getElementById('password').value = 'password123';
    });
</script>
</body>
</html>
