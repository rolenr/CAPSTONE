<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Parking Ltd.</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><h1>Parking Ltd. - Customer Portal</h1></header>
<div class="container">
    <div class="card">
        <h2>Create an Account</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="regEmail" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" minlength="6" required>
            </div>
            <div class="form-group">
                <label>Vehicle License Plate (One per account)</label>
                <input type="text" id="regPlate" placeholder="e.g. ABC-1234" required>
            </div>
            <button type="submit">Register Vehicle & Account</button>
        </form>
        <p style="text-align: center; margin-top: 15px;">
            Already have an account? <a href="login.html">Login here</a>
        </p>
    </div>
</div>
<script src="js/main.js"></script>
</body>
</html>
